# English copy (base fallback for any en-* locale).
# Keys must stay in lockstep with messages_zh_CN.properties.

# ---- Common error codes ----
error.common.internal.error=Internal server error. See the service log for details.
error.common.param.invalid=The request parameters are invalid.
error.common.unauthorized=Not authenticated, or the credentials are invalid.
error.common.session.expired=Your session has expired. Please sign in again.
error.common.login.failed=Incorrect username or password.
error.common.forbidden=You do not have permission to access this resource.

# ---- Business error codes: parameters and tasks ----
error.param.invalid=The request parameters are invalid.
error.param.malformed-json=The request body is not valid JSON.
error.param.time-format=Time must be formatted as yyyy-MM-dd HH:mm.
error.param.self-command.alias-too-long=The self-command alias exceeds the {0}-character limit.
error.param.history-sync.unsupported=This platform does not support fetching message history.
error.task.schedule-conflict=Scheduling conflict: provide either fireAt or cron, not both.
error.task.content-required=A task needs either content or prompt.
error.task.cron-invalid=The cron expression is invalid.
error.task.state-not-allowed=The task's current state does not allow this operation.

# ---- Business error codes: resources and auth ----
error.resource.not-found=The requested resource does not exist.
error.data.conflict=Data conflict: a unique key is duplicated or a constraint is not satisfied.
error.auth.not-configured=Sign-in is disabled because admin credentials are not configured.
error.auth.invalid-credentials=Incorrect username or password.
error.upstream.unavailable=The upstream service is temporarily unavailable.
