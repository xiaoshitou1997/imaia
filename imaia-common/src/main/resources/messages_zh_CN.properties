# 中文文案（默认 locale）。
# 键名规则：error.<code>，与 ErrorCode.messageKey() 一一对应。
# 新增键必须与 messages_en_US.properties 同批补齐。

# ---- 公共错误码 ----
error.common.internal.error=服务器内部错误，详情见服务日志。
error.common.param.invalid=请求参数不合法。
error.common.unauthorized=未认证或凭据无效。
error.common.session.expired=登录状态已过期，请重新登录。
error.common.login.failed=用户名或密码错误。
error.common.forbidden=没有访问该资源的权限。

# ---- 业务错误码：参数与任务 ----
error.param.invalid=请求参数不合法。
error.param.malformed-json=请求体不是合法 JSON。
error.param.time-format=时间格式应为 yyyy-MM-dd HH:mm。
error.param.self-command.alias-too-long=自指令别名超过长度上限 {0} 个字符。
error.param.history-sync.unsupported=该平台不支持拉取历史消息。
error.task.schedule-conflict=定时设置冲突：fireAt 与 cron 必须二选一。
error.task.content-required=任务需要 content 或 prompt。
error.task.cron-invalid=cron 表达式无效。
error.task.state-not-allowed=该任务当前状态不允许此操作。

# ---- 业务错误码：资源与认证 ----
error.resource.not-found=要访问的资源不存在。
error.data.conflict=数据冲突：唯一键重复或约束不满足。
error.auth.not-configured=登录未启用：管理员凭据未配置。
error.auth.invalid-credentials=用户名或密码错误。
error.upstream.unavailable=上游服务暂时不可用。
