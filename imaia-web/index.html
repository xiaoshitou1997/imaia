<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/images/favicon_light.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      href="/images/favicon_light.png"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 主元信息：控制台仅供本机使用 -->
    <title>imaia 中枢 · 控制台</title>
    <meta name="title" content="imaia 中枢 · 控制台" />
    <meta
      name="description"
      content="imaia 中枢控制台：会话归档、AI 助手、定时任务与平台接入管理。"
    />

    <!-- 这是仅回环访问的内网控制台，按规范不配置分享卡（Open Graph / Twitter Card）。 -->

    <!-- font family -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <!-- 主题色取设计令牌：浅/深色各一套，不写死十六进制 -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#020817" media="(prefers-color-scheme: dark)" />

    <style>
      /* 首屏静态品牌占位：避免挂载前的白闪，也不呈现脚手架默认样式。 */
      #root:empty {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #64748b;
        font-family: Inter, Manrope, system-ui, sans-serif;
        font-size: 0.875rem;
      }
      #root:empty::after {
        content: 'imaia 中枢 · 正在加载…';
      }
      @media (prefers-color-scheme: dark) {
        #root:empty {
          background: #020817;
          color: #94a3b8;
        }
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
