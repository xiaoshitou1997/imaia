# imaia — 多平台个人 AI 助理（IM AI Assistant）
# 平台接入配置（daemon 地址/token、飞书 app 凭据等）统一存数据库 platform_account
# 表（config JSONB），不在环境变量/yml 里；本文件只承载启动前置与基础设施。
server:
  # WebUI and control API bind to loopback only.
  address: ${IMAIA_WEB_ADDRESS:127.0.0.1}
  port: ${IMAIA_WEB_PORT:8091}

spring:
  main:
    # Embedded servlet server hosts the local WebUI and control API (loopback only).
    web-application-type: servlet
  datasource:
    # PostgreSQL for conversation history, message archive and processed-message records.
    url: ${IMAIA_PG_URL:jdbc:postgresql://127.0.0.1:15432/infra}
    username: ${IMAIA_PG_USERNAME:infra}
    password: ${IMAIA_PG_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      # Redis for atomic reply rate-limit counters and the stream cursor;
      # falls back to in-memory counting on error.
      host: ${IMAIA_REDIS_HOST:127.0.0.1}
      port: ${IMAIA_REDIS_PORT:16379}
      password: ${IMAIA_REDIS_PASSWORD:}

logging:
  level:
    reactor:
      netty: WARN
    com.imaia.consumer.ai: DEBUG

imaia:
  dispatch:
    # Consecutive failures on the same event before the stream stops (poison guard).
    handler-failure-threshold: 5
  ai:
    # Master switch for the AI reply chain (checked by the event handler). The
    # assistant persona, model directory and risk policy live in the database
    # (assistant_profile / provider+model / risk_policy) and are edited in the WebUI;
    # migration V9 seeds them.
    enabled: false
